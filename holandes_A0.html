<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1117">
<title>Holandés A0 — Primeros pasos</title>
<style>:root{
  --bg:#0e1117; --surface:#161b24; --surface2:#1d2330; --line:#2a3242;
  --text:#e7eaf0; --muted:#9aa4b5; --faint:#6b7587;
  --accent:#ff8a3d; --accent-soft:rgba(255,138,61,.14);
  --blue:#6cb2ff; --blue-soft:rgba(108,178,255,.12);
  --green:#44d19a; --green-soft:rgba(68,209,154,.13);
  --red:#ff7272; --red-soft:rgba(255,114,114,.13);
  --yellow:#ffd166;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:8px;flex-wrap:wrap}
.back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
.back:hover{color:var(--text)}
.lvsel{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font:inherit;font-size:13px}
.badge{background:var(--accent);color:#1a0f05;font-weight:800;border-radius:10px;padding:4px 10px;font-size:15px}
.ttl{flex:1;min-width:180px}
.ttl h1{font-size:17px;margin:0;line-height:1.3}
.ttl p{margin:0;color:var(--muted);font-size:13px}
.prog{min-width:160px;flex:0 1 220px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--yellow));transition:width .5s}
.prog small{color:var(--muted);font-size:12px}
.speed{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:4px 12px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;max-width:900px;margin:0 auto;scrollbar-width:thin}
.tab{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.tab.done::after{content:" ✓";color:var(--green);font-weight:700}
.tab.special{border-style:dashed}

main{padding:22px 0 80px}
.panel{display:none}
.panel.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h2{font-size:26px;margin:4px 0 6px;line-height:1.25}
h3{font-size:19px;margin:0 0 10px}
.kicker{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:16px 0}
.goal{background:var(--blue-soft);border-left:4px solid var(--blue);padding:12px 16px;border-radius:10px;margin:12px 0}

/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--faint);border:1px solid transparent}
.chip.reached{color:var(--text);border-color:var(--line);cursor:pointer}
.chip.current{border-color:var(--accent);color:var(--accent)}
.showall{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0;margin-left:auto}

.stage{margin-top:18px}
.stage.hidden,.step.hidden{display:none}
.stage-title{display:flex;align-items:center;gap:10px;margin:26px 0 6px}
.stage-title .num{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:13px;color:var(--muted)}
.stage-title h3{margin:0}

.step{animation:fade .3s}
.step h4{margin:0 0 8px;font-size:18px;color:var(--yellow)}
.step p{margin:8px 0}
.tip{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:15.5px}
.tip b:first-child{color:var(--accent)}
.nl{color:var(--accent);font-weight:600}
.hl{background:rgba(255,209,102,.18);border-radius:4px;padding:0 3px}

.ex{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:none}
.ex .t{flex:1}
.ex .nlt{font-weight:600;font-size:18px}
.ex .es{color:var(--muted);font-size:15px}
.pron{color:var(--blue);font-size:14px;font-style:italic}
.exs{background:var(--surface2);border-radius:10px;padding:6px 14px;margin:10px 0}

table.t{border-collapse:collapse;width:100%;margin:10px 0;font-size:15.5px}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--surface2);color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}

.say{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--accent);display:inline-grid;place-items:center;padding:0}
.say:hover{border-color:var(--accent)}
.say svg{width:17px;height:17px}
.say.playing{background:var(--accent);color:#1a0f05}

.btn{background:var(--accent);color:#1a0f05;border:none;border-radius:10px;padding:10px 18px;font-weight:700;margin-top:10px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{padding:6px 12px;font-size:14px;margin-top:6px}
.btn.green{background:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.check{margin-top:12px;background:var(--surface2);border-radius:10px;padding:10px 14px}
.check .q{font-weight:600}
.reveal{display:none;margin-top:6px;color:var(--green)}
.reveal.on{display:block;animation:fade .25s}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.vitem{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.vitem .t{flex:1;min-width:0}
.vitem .w{font-weight:700;font-size:17px}
.vitem .m{color:var(--muted);font-size:15px}
.vitem .n{color:var(--faint);font-size:13px;margin-top:2px}
.art-de{color:var(--blue)} .art-het{color:#c792ea}

/* dialogue */
.dlg .line{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.who{flex:0 0 auto;min-width:80px;font-size:13px;color:var(--muted);padding-top:4px}
.bubble{flex:1;background:var(--surface2);border-radius:12px;padding:8px 12px}
.line:nth-child(even) .bubble{background:var(--blue-soft)}
.bubble .es{display:none;color:var(--muted);font-size:15px}
.dlg.tr .bubble .es{display:block}

/* practice & quiz */
.pq{padding:12px 0;border-top:1px dashed var(--line)}
.pq:first-child{border-top:none}
.rv{font-size:11px;font-weight:700;background:var(--yellow);color:#231a00;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:middle}
.qz{background:var(--surface2);border-radius:12px;padding:14px 16px;margin:12px 0}
.qz .q{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15.5px;display:none}
.fb.on{display:block;animation:fade .25s}
.fb.ok{background:var(--green-soft)} .fb.ko{background:var(--red-soft)}
.fb b{display:block}
.winput{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.winput:focus{outline:none;border-color:var(--accent)}
.score{font-size:18px;font-weight:700}
.result{border-radius:var(--radius);padding:16px 18px;margin:16px 0;background:var(--green-soft);border:1px solid var(--green)}
.result.meh{background:var(--accent-soft);border-color:var(--accent)}

.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}

/* flashcards */
.fc{perspective:1000px;margin:16px auto;max-width:460px}
.fcard{background:var(--surface2);border:1px solid var(--line);border-radius:18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
.fcard .big{font-size:30px;font-weight:800}
.fcard .back{display:none}
.fcard.flip .back{display:block;animation:fade .25s}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.filters select,.filters input{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);color:var(--muted);border:none;padding:8px 14px;font-size:14px}
.seg button.on{background:var(--accent-soft);color:var(--text)}

.toplist{list-style:none;padding:0;margin:0}
.toplist li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.toplist li:first-child{border-top:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:12px}
.dot.ok{background:var(--green);border-color:var(--green);color:#062017}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin:16px 0}
summary{cursor:pointer;font-weight:600}
.warn{color:var(--yellow);font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--green);color:#062017;font-weight:700;padding:12px 20px;border-radius:12px;transition:transform .35s;z-index:50;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.celebrate{text-align:center;padding:24px;border-radius:18px;background:linear-gradient(135deg,rgba(255,138,61,.18),rgba(68,209,154,.16));border:1px solid var(--accent);margin:16px 0}
.celebrate h3{font-size:24px}
@media (max-width:600px){
  body{font-size:16px}
  h2{font-size:22px}
  .who{min-width:60px}
  .prog{flex:1 1 120px;min-width:120px}
  .ttl p{display:none}
  .badge{display:none}
  .ttl{min-width:0;flex-basis:calc(100% - 150px)}
  .top .wrap{gap:8px 12px}
}
</style></head>
<body><noscript>Este curso necesita JavaScript activado.</noscript>
<script>window.LEVEL = {
  id: "A0",
  title: "Nivel A0 — Primeros pasos",
  subtitle: "Desde cero: sonidos, saludos y presentarte en Groningen",
  prev: null,
  next: "A1",
  intro: "Bienvenido. Aquí empiezas <b>desde cero absoluto</b>. No hace falta saber nada. En este nivel vas a aprender cómo suena el holandés, a saludar, a decir quién eres y de dónde vienes, a contar hasta 20 y unas frases “salvavidas” para el día a día en Groningen. Vamos muy despacio: un paso cada vez, siempre con ejemplos y audio.",
  studyPlan: [
    "Días 1-2: Tema 1 (los sonidos). Escucha mucho; no pasa nada si aún no te salen.",
    "Días 3-4: Tema 2 (saludos) y Tema 3 (presentarte).",
    "Días 5-6: Tema 4 (ik ben / ik heb). Es el corazón del nivel: tómalo con calma.",
    "Día 7: Tema 5 (números 0-20).",
    "Días 8-9: Tema 6 (frases salvavidas) y Tema 7 (de / het).",
    "Día 10: repasa las tarjetas de Vocabulario y haz el Quiz final. 15-20 minutos al día bastan."
  ],
  canDo: [
    "Pronunciar los sonidos típicos del holandés (g, ui, ij, oe, eu…) de forma entendible.",
    "Saludar y despedirte de forma formal e informal.",
    "Decir tu nombre, de dónde eres, dónde vives y a qué te dedicas.",
    "Usar <span class='nl'>ik ben</span> (soy/estoy) e <span class='nl'>ik heb</span> (tengo) con todas las personas.",
    "Contar de 0 a 20 y decir tu edad.",
    "Pedir que te repitan, que hablen despacio o preguntar el precio.",
    "Saber que cada sustantivo lleva <span class='nl'>de</span> o <span class='nl'>het</span>."
  ],
  review: [],

  topics: [
    /* ================= TEMA 1 ================= */
    {
      id: "t1",
      title: "Los sonidos",
      goal: "Reconocer y pronunciar los sonidos típicos del holandés, sobre todo los que no existen en español.",
      steps: [
        {
          title: "Paso 1: Buenas noticias",
          html: "<p>El holandés se escribe con las mismas letras que el español. Y hay una gran ventaja: <b>casi siempre se lee igual como se escribe</b>, con unas pocas reglas.</p><p>Muchas palabras ya las entiendes: </p>",
          examples: [
            { nl: "de universiteit", es: "la universidad", pron: "de ü-ni-ver-si-TEIT" },
            { nl: "de computer", es: "la computadora", pron: "de kom-PIU-ter" },
            { nl: "de telefoon", es: "el teléfono", pron: "de te-le-FOON" },
            { nl: "het station", es: "la estación (de tren)", pron: "het sta-SJON" }
          ],
          tip: "<b>Truco:</b> pulsa siempre el altavoz y repite en voz alta 2 veces. Hablar en voz alta, aunque sea solo, es lo que más ayuda.",
          check: { q: "¿Qué significa <span class='nl'>de telefoon</span>?", a: "El teléfono." }
        },
        {
          title: "Paso 2: La G y la CH suenan como nuestra J",
          html: "<p>Este es el sonido más famoso del holandés. Para ti es fácil: <b>g</b> y <b>ch</b> suenan como la <b>jota</b> española (“jamón”), pero más suave, como si carraspearas un poquito.</p>",
          examples: [
            { nl: "goed", es: "bien", pron: "jut" },
            { nl: "Groningen", es: "Groningen (tu ciudad)", pron: "JRO-ning-e(n)" },
            { nl: "acht", es: "ocho", pron: "ajt" },
            { nl: "gezellig", es: "acogedor, agradable", pron: "je-ZE-lej" }
          ],
          tip: "<b>Comparado con el español:</b> nunca pronuncies la g holandesa como en “gato”. Piensa siempre en “jota”. Excepción: en <span class='nl'>-ng</span> suena como en “tengo”: <span class='nl'>Groningen</span>.",
          check: { q: "¿Cómo suena la <b>g</b> de <span class='nl'>goed</span>?", a: "Como una jota española suave: “jut”." }
        },
        {
          title: "Paso 3: Vocales largas y cortas",
          html: "<p>En holandés una vocal puede ser corta o larga, y eso cambia el significado. <b>Si la vocal está escrita dos veces, es larga</b>: aa, ee, oo, uu.</p>",
          examples: [
            { nl: "man", es: "hombre (a corta)", pron: "man" },
            { nl: "maan", es: "luna (a larga)", pron: "maan" },
            { nl: "bom", es: "bomba (o corta)", pron: "bom" },
            { nl: "boom", es: "árbol (o larga)", pron: "boom" }
          ],
          tip: "<b>Truco:</b> la vocal larga es como alargar la vocal española: “maaan”. No hace falta que sea perfecto; basta con que se note la diferencia.",
          check: { q: "¿Cuál es la palabra para “árbol”: <span class='nl'>bom</span> o <span class='nl'>boom</span>?", a: "<span class='nl'>boom</span> (o larga, escrita doble)." }
        },
        {
          title: "Paso 4: Combinaciones que parecen raras (1)",
          html: "<p>Solo tienes que aprender unas pocas “parejas de letras”. Empecemos con tres fáciles:</p><ul><li><b>oe</b> = nuestra <b>u</b></li><li><b>ie</b> = nuestra <b>i</b></li><li><b>ij</b> y <b>ei</b> = <b>ei</b> (como en “rey”). Suenan igual.</li></ul>",
          examples: [
            { nl: "goedemorgen", es: "buenos días", pron: "ju-de-MOR-je(n)" },
            { nl: "de fiets", es: "la bicicleta", pron: "de fiits" },
            { nl: "mijn", es: "mi", pron: "mein" },
            { nl: "klein", es: "pequeño", pron: "klein" }
          ],
          table: { head: ["Se escribe", "Suena como", "Ejemplo"], rows: [["oe", "u", "goed (jut)"], ["ie", "i", "fiets (fiits)"], ["ij / ei", "ei", "mijn (mein) / klein"]] },
          check: { q: "¿Cómo se pronuncia <span class='nl'>fiets</span>?", a: "“fiits”, con i (la combinación ie suena i)." }
        },
        {
          title: "Paso 5: Combinaciones que parecen raras (2)",
          html: "<p>Ahora las tres que no existen en español. No te preocupes si al principio suenan parecidas:</p><ul><li><b>ui</b> = <b>öi</b>: di “ei” pero con los labios redondos, como para dar un beso.</li><li><b>eu</b> = <b>ö</b>: di “e” con los labios redondos.</li><li><b>u / uu</b> = <b>ü</b>: di “i” con los labios redondos (como la <i>u</i> francesa).</li><li><b>ou / au</b> = <b>au</b>, fácil, como en “auto”.</li></ul>",
          examples: [
            { nl: "het huis", es: "la casa", pron: "het höis" },
            { nl: "leuk", es: "divertido, chévere", pron: "lök" },
            { nl: "het uur", es: "la hora", pron: "het üür" },
            { nl: "koud", es: "frío", pron: "kaut" }
          ],
          tip: "<b>Truco del espejo:</b> mírate al espejo. Si tus labios están redondos (como para silbar) cuando dices <span class='nl'>huis</span>, <span class='nl'>leuk</span> o <span class='nl'>uur</span>, lo estás haciendo bien.",
          check: { q: "¿Cuál es la palabra que significa “casa”?", a: "<span class='nl'>het huis</span> (höis)." }
        },
        {
          title: "Paso 6: Unas consonantes distintas",
          html: "<ul><li><b>j</b> holandesa = nuestra <b>y</b>: <span class='nl'>ja</span> = “ya”.</li><li><b>sch</b> = <b>s + jota</b>: <span class='nl'>school</span> = “sjool”.</li><li><b>w</b> = una “v/u” suave: <span class='nl'>wat</span>.</li><li><b>h</b> se pronuncia (aspirada, como en inglés “hello”).</li><li><b>d</b> al final de palabra suena <b>t</b>.</li></ul>",
          examples: [
            { nl: "ja", es: "sí", pron: "ya" },
            { nl: "de school", es: "la escuela", pron: "de sjool" },
            { nl: "wat", es: "qué", pron: "wat" },
            { nl: "hallo", es: "hola", pron: "HA-lo (h aspirada)" },
            { nl: "het brood", es: "el pan", pron: "het broot" }
          ],
          check: { q: "¿Cómo suena la palabra <span class='nl'>ja</span>?", a: "“ya”. La j holandesa suena como nuestra y." }
        }
      ],
      vocab: [
        { nl: "ja", pron: "ya", es: "sí" },
        { nl: "nee", pron: "nee", es: "no" },
        { nl: "goed", pron: "jut", es: "bien" },
        { nl: "leuk", pron: "lök", es: "divertido, bonito, chévere", note: "Palabra muy usada: “Leuk!” = ¡Qué bien!" },
        { nl: "gezellig", pron: "je-ZE-lej", es: "acogedor, agradable (ambiente)", note: "Palabra típica holandesa, sin traducción exacta." },
        { nl: "het huis", pron: "het höis", es: "la casa" },
        { nl: "de fiets", pron: "de fiits", es: "la bicicleta" },
        { nl: "de universiteit", pron: "de ü-ni-ver-si-TEIT", es: "la universidad" },
        { nl: "het station", pron: "het sta-SJON", es: "la estación" },
        { nl: "de school", pron: "de sjool", es: "la escuela" },
        { nl: "het brood", pron: "het broot", es: "el pan" },
        { nl: "koud", pron: "kaut", es: "frío" },
        { nl: "klein", pron: "klein", es: "pequeño" },
        { nl: "groot", pron: "jroot", es: "grande" }
      ],
      dialogue: {
        title: "Primeras palabras",
        context: "Un compañero de la universidad te enseña palabras típicas mientras van hacia la estación.",
        lines: [
          { who: "Sanne", nl: "Hallo! Fiets je naar het station?", es: "¡Hola! ¿Vas en bici a la estación?" },
          { who: "Tú", nl: "Ja!", es: "¡Sí!" },
          { who: "Sanne", nl: "Leuk! Het is koud vandaag.", es: "¡Qué bien! Hace frío hoy." },
          { who: "Tú", nl: "Ja, heel koud.", es: "Sí, mucho frío." },
          { who: "Sanne", nl: "Maar Groningen is gezellig!", es: "¡Pero Groningen es acogedor!" },
          { who: "Tú", nl: "Ja, heel gezellig.", es: "Sí, muy acogedor." }
        ]

<script>(function(){
"use strict";
const L = window.LEVEL;
// Progreso guardado solo en memoria (dura mientras la página esté abierta)
const S = { done:{}, final:null, rate:0.75, last:null };
// Progreso guardado en este navegador (localStorage), compartido con el índice
const KEY = 'holandes_progreso_v1';
function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function saveLevel(){
  try {
    const all = loadAll(); const tops = L.topics || [];
    all[L.id] = { done: S.done, final: S.final, last: S.last,
      complete: tops.every(t => S.done[t.id]) && !!(S.final && S.final.ok),
      topicsDone: tops.filter(t => S.done[t.id]).length, topicsTotal: tops.length, updated: Date.now() };
    localStorage.setItem(KEY, JSON.stringify(all));
  } catch(e){}
}
(function(){ const me = loadAll()[L.id]; if(me){ S.done = me.done || {}; S.final = me.final || null; S.last = me.last || null; } try{ const r = parseFloat(localStorage.getItem('holandes_audio')); if(r) S.rate = r; }catch(e){} })();
const LEVELS = ['A0','A1','A2','B1','B2'];
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip = s => String(s||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ');
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const say = t => `<button class="say" title="Escuchar" aria-label="Escuchar" data-say="${esc(strip(t))}">${SPK}</button>`;
const art = s => String(s).replace(/^(de|het)\s/i, (m,a) => `<span class="art-${a.toLowerCase()}">${a}</span> `);
const TOPICS = L.topics || [];

/* ---------- audio ---------- */
let nlVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  nlVoice = vs.find(v => /^nl[-_]NL/i.test(v.lang)) || vs.find(v => /^nl/i.test(v.lang)) || null;
  const w = $('#voicewarn');
  if(w) w.style.display = (vs.length && !nlVoice) ? 'block' : 'none';
}
function speak(text, btn){
  if(!('speechSynthesis' in window)) { toast('Tu navegador no tiene audio. Usa la pronunciación escrita en azul.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,'').replace(/\s*\/\s*/g,', '));
  u.lang = 'nl-NL'; if(nlVoice) u.voice = nlVoice; u.rate = S.rate;
  if(btn){ btn.classList.add('playing'); u.onend = u.onerror = () => btn.classList.remove('playing'); }
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

/* ---------- helpers ---------- */
function toast(msg){ const t=$('#toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2800); }
const cheer = () => { const c = L.cheer && L.cheer.length ? L.cheer : ['Goed gedaan! ¡Muy bien hecho!']; return c[Math.floor(Math.random()*c.length)]; };
const exHTML = e => `<div class="ex">${say(e.nl)}<div class="t"><div class="nlt">${e.nl}</div>${e.pron?`<div class="pron">${e.pron}</div>`:''}<div class="es">${e.es}</div></div></div>`;
const tableHTML = t => `<div class="tscroll"><table class="t"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const vitemHTML = v => `<div class="vitem">${say(v.nl)}<div class="t"><div class="w">${art(v.nl)}</div>${v.pron?`<div class="pron">${v.pron}</div>`:''}<div class="m">${v.es}</div>${v.note?`<div class="n">${v.note}</div>`:''}</div></div>`;
const norm = s => strip(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[.,!?¿¡;:"“”'’()]/g,'').replace(/\s+/g,' ').trim();

/* ---------- quiz ---------- */
function renderQuiz(box, qs, onDone){
  let answered = 0, right = 0;
  box.innerHTML = qs.map((q,i)=>{
    const tag = q.review ? '<span class="rv">REPASO</span>' : '';
    const body = q.type === 'write'
      ? `<input class="winput" placeholder="Escribe tu respuesta..." autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn small" data-act="chk">Comprobar</button><button class="btn small ghost" data-act="idk">No lo sé</button></div>`
      : `<div class="opts">${q.options.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>`;
    return `<div class="qz" data-i="${i}"><div class="q">${tag}${i+1}. ${q.q}</div>${body}<div class="fb"></div></div>`;
  }).join('') + `<div class="qres"></div>`;
  const finish = (card, ok, q, given) => {
    answered++; if(ok) right++;
    const fb = $('.fb', card);
    const sol = q.type === 'write' ? `<div>Respuesta: <span class="nl">${q.accept[0]}</span> ${say(q.accept[0])}</div>` : '';
    fb.className = 'fb on ' + (ok ? 'ok' : 'ko');
    fb.innerHTML = `<b>${ok ? '¡Correcto!' : (given==='idk' ? 'No pasa nada, así se aprende:' : 'Casi. Mira por qué:')}</b>${sol}${q.explain||''}`;
    if(answered === qs.length){
      const pct = Math.round(100*right/qs.length);
      const res = $('.qres', box);
      res.innerHTML = `<div class="result ${pct>=60?'':'meh'}"><div class="score">${right} de ${qs.length} correctas (${pct}%)</div><div>${pct>=60 ? cheer() : 'Está bien equivocarse: repasa los pasos con calma y vuelve a intentarlo. Cada intento cuenta.'}</div><button class="btn small ghost" data-act="redo">Repetir este quiz</button></div>`;
      $('[data-act=redo]', res).onclick = () => renderQuiz(box, shuffleQs(qs), onDone);
      onDone && onDone(right, qs.length);
    }
  };
  $$('.qz', box).forEach(card => {
    const q = qs[+card.dataset.i];
    if(q.type === 'write'){
      const inp = $('.winput', card);
      const check = (idk) => {
        if(card.dataset.done) return; card.dataset.done = 1;
        const ok = !idk && q.accept.some(a => norm(a) === norm(inp.value));
        inp.disabled = true; $$('button', card).forEach(b=>b.disabled=true);
        inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
        finish(card, ok, q, idk?'idk':'');
      };
      $('[data-act=chk]', card).onclick = () => { if(!inp.value.trim()){ inp.focus(); return; } check(false); };
      $('[data-act=idk]', card).onclick = () => check(true);
      inp.addEventListener('keydown', e => { if(e.key==='Enter' && inp.value.trim()) check(false); });
    } else {
      $$('.opt', card).forEach(b => b.onclick = () => {
        const j = +b.dataset.j, ok = j === q.answer;
        $$('.opt', card).forEach(x => { x.disabled = true; if(+x.dataset.j === q.answer) x.classList.add('right'); });
        if(!ok) b.classList.add('wrong');
        finish(card, ok, q);
      });
    }
  });
}
function shuffleQs(qs){
  return qs.map(q => {
    if(q.type === 'write' || !q.options) return q;
    const idx = q.options.map((_,i)=>i).sort(()=>Math.random()-.5);
    return Object.assign({}, q, { options: idx.map(i=>q.options[i]), answer: idx.indexOf(q.answer) });
  });
}

function topicHTML(t, i){
  const stages = [];
  stages.push({key:'steps', label:'Explicación paso a paso'});
  if(t.vocab && t.vocab.length) stages.push({key:'vocab', label:'Vocabulario'});

  t._stages = stages;
  const stepHTML = (s, k) => `<div class="card step ${k>0?'hidden':''}" data-step="${k}">

    dlg: () => `<div class="card"><h3>${t.dialogue.title||''}</h3>${t.dialogue.context?`<p class="muted">${t.dialogue.context}</p>`:''}
        <div class="row" style="margin-bottom:8px"><button class="btn small ghost" data-tr>Mostrar / ocultar traducción</button><button class="btn small ghost" data-playall>Escuchar todo</button></div>
        <div class="dlg">${t.dialogue.lines.map(l=>`<div class="line"><div class="who">${l.who||''}</div><div class="bubble"><div class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start">${say(l.nl)}<div><div>${l.nl}</div><div class="es">${l.es}</div></div></div></div></div>`).join('')}</div>

function wireTopic(t){
  const sec = $('#p-'+t.id);
  const reach = k => {
    const st = $(`[data-stage="${k}"]`, sec); if(!st) return;
    st.classList.remove('hidden');
    $$('.chip', sec).forEach(c => { const n=+c.dataset.chip; if(n<=k) c.classList.add('reached'); c.classList.toggle('current', n===k); });
    return st;
  };
  $$('[data-next-step]', sec).forEach(b => b.onclick = () => {
    const cur = b.closest('.step'); const n = +cur.dataset.step + 1;
    b.style.display = 'none';
    const nx = $(`[data-step="${n}"]`, sec); nx.classList.remove('hidden');
    if(n === t.steps.length-1){ const c = $('[data-stage="0"] [data-next-stage]', sec); if(c) c.style.display=''; }
    nx.scrollIntoView({behavior:'smooth', block:'start'});
  });
  $$('[data-next-stage]', sec).forEach(b => b.onclick = () => { b.style.display='none'; const st = reach(+b.dataset.nextStage); st.scrollIntoView({behavior:'smooth', block:'start'}); });
  $$('.chip', sec).forEach(c => c.onclick = () => { if(!c.classList.contains('reached')) return; $(`[data-stage="${c.dataset.chip}"]`, sec).scrollIntoView({behavior:'smooth', block:'start'}); });
  $('[data-showall]', sec).onclick = () => {
    $$('.step', sec).forEach(s=>s.classList.remove('hidden')); $$('[data-next-step]', sec).forEach(b=>b.style.display='none');
    $$('[data-next-stage]', sec).forEach(b=>b.style.display='none');
    t._stages.forEach((_,k)=>reach(k)); reach(0);
  };
  const dlg = $('.dlg', sec);
  if(dlg){
    $('[data-tr]', sec).onclick = () => dlg.classList.toggle('tr');
    $('[data-playall]', sec).onclick = () => {
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      t.dialogue.lines.forEach(l => { const u = new SpeechSynthesisUtterance(strip(l.nl)); u.lang='nl-NL'; if(nlVoice) u.voice=nlVoice; u.rate=S.rate; speechSynthesis.speak(u); });
    };
  }
  const qb = $('.quizbox', sec);
  if(qb) renderQuiz(qb, t.quiz, (r,n) => completeTopic(t, r, n));
}
function completeTopic(t, r, n){
  const first = !S.done[t.id];
  S.done[t.id] = true; refresh();
  const box = $('#p-'+t.id+' .topicdone');
  const i = TOPICS.indexOf(t);
  box.innerHTML = `<div class="celebrate"><h3>Tema completado</h3><p>${cheer()}</p>
    <p class="muted">Antes de seguir: repite en voz alta 3 palabras de este tema. Si algo te costó, vuelve a los pasos: repetir es parte del método.</p>
    ${i<TOPICS.length-1?`<button class="btn" data-go="${TOPICS[i+1].id}">Siguiente tema: ${TOPICS[i+1].title} &rarr;</button>`:`<button class="btn" data-go="final">Ir al quiz final &rarr;</button>`}</div>`;
  if(first) toast('Tema completado: ' + t.title);
}

const FC = { deck:[], known:0, dir:'nl' };
function vfiltered(){
  const tp = $('#vtopic').value, q = norm($('#vsearch').value);

function drawVocab(){
  const mode = $('[data-vmode].on').dataset.vmode, list = vfiltered(), vb = $('#vbody');
  if(mode === 'list'){ vb.innerHTML = list.length ? `<div class="vgrid">${list.map(vitemHTML).join('')}</div>` : '<p class="muted">Nada encontrado.</p>'; return; }

function drawCard(){
  const vb = $('#vbody');
  if(!FC.total){ vb.innerHTML = '<p class="muted">Nada encontrado.</p>'; return; }
  if(!FC.deck.length){ vb.innerHTML = `<div class="celebrate"><h3>¡Mazo terminado!</h3><p>Repasaste ${FC.total} tarjetas. ${cheer()}</p><button class="btn" id="fcagain">Empezar otra vez</button></div>`; $('#fcagain').onclick = drawVocab; return; }
  const v = FC.deck[0], front = FC.dir==='nl';
  vb.innerHTML = `<div class="row"><span class="muted">Sabidas: ${FC.known} / ${FC.total}</span><div class="seg" style="margin-left:auto"><button data-dir="nl" class="${front?'on':''}">Holandés → español</button><button data-dir="es" class="${front?'':'on'}">Español → holandés</button></div></div>

   <div class="fc"><div class="fcard" id="fcard">
     <div class="muted" style="font-size:13px">${v.ttitle}</div>
     ${front ? `<div class="big">${art(v.nl)}</div>` : `<div class="big" style="font-size:24px">${v.es}</div>`}
     <div class="back">${front ? `<div class="pron">${v.pron||''}</div><div style="font-size:20px">${v.es}</div>` : `<div class="big">${art(v.nl)}</div><div class="pron">${v.pron||''}</div>`}${v.note?`<div class="muted" style="font-size:14px">${v.note}</div>`:''}</div>
   </div></div>
   <div class="row" style="justify-content:center">${say(v.nl)}<button class="btn" id="fcflip">Mostrar respuesta</button></div>
   <div class="row" style="justify-content:center;display:none" id="fcgrade"><button class="btn ghost" id="fcagain2">Repasar otra vez</button><button class="btn green" id="fcok">Lo sé</button></div>`;
  if(front) speak(v.nl);
  $$('[data-dir]', vb).forEach(b => b.onclick = () => { FC.dir = b.dataset.dir; drawCard(); });

/* ---------- Quiz final ---------- */
function finalHTML(){
  return `<section class="panel" id="p-final"><span class="kicker">Nivel ${L.id}</span><h2>Quiz final</h2>
    <p class="muted">Mezcla de todo el nivel, sin presión: no es un examen. Si aciertas el 70% o más, el nivel cuenta como completado.</p>
    <div id="finalbox"></div><div id="finaldone"></div></section>`;

function onFinal(r, n){
  const pct = Math.round(100*r/n);
  const prev = S.final;
  S.final = { r, n, ok: pct >= 70 || !!(prev && prev.ok), best: Math.max(pct, (prev && prev.best) || 0) };
  refresh();
  const allTopics = TOPICS.every(t => S.done[t.id]);
  const box = $('#finaldone');
  if(pct >= 70 && allTopics) box.innerHTML = levelDoneHTML();
  else if(pct >= 70) box.innerHTML = `<div class="result">¡Muy buen resultado! Te faltan algunos temas por marcar como completados: ${TOPICS.filter(t=>!S.done[t.id]).map(t=>`<a href="#" data-go="${t.id}">${t.title}</a>`).join(', ')}.</div>`;
  else box.innerHTML = `<div class="result meh">Todavía no llegas al 70%, y eso es totalmente normal. Mira qué preguntas fallaste, vuelve a esos temas un ratito y repite el quiz mañana.</div>`;
  const ld = $('#lvl-done'); if(pct>=70 && allTopics) ld.innerHTML = levelDoneHTML();
}
function levelDoneHTML(){
  return `<div class="celebrate"><h3>¡Nivel ${L.id} completado!</h3><p>${cheer()}</p>
   <p><b>Micro-meta para mañana:</b> ${L.microGoal}</p>
   <p class="muted">Tu progreso quedó guardado en este navegador y el menú ya muestra el nivel como completado.</p>
   <a class="btn ghost" style="display:inline-block;text-decoration:none;margin-right:8px" href="index.html">&larr; Volver al menú</a>
   ${L.next ? `<a class="btn" style="display:inline-block;text-decoration:none" href="holandes_${L.next}.html">Ir al nivel ${L.next} &rarr;</a>`:''}</div>`;
}

let vocabDrawn = false;
function show(id){
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-'+id));
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === id));
  const tb = $(`.tab[data-tab="${id}"]`); if(tb) tb.scrollIntoView({block:'nearest', inline:'center'});
  if(id === 'vocab' && !vocabDrawn){ vocabDrawn = true; drawVocab(); }
  window.scrollTo(0,0);
  if(history.replaceState) history.replaceState(null,'','#'+id);
  if(id !== 'inicio'){ S.last = id; saveLevel(); }

function refresh(){
  const total = TOPICS.length + 1;
  const done = TOPICS.filter(t=>S.done[t.id]).length + (S.final && S.final.ok ? 1 : 0);
  $('#pbar').style.width = Math.round(100*done/total) + '%';
  $('#ptxt').textContent = `${done} de ${total} completados`; $('#ptxt').title = 'Temas + quiz final. El progreso se guarda en este navegador.';
  saveLevel();
  $$('.tab').forEach(t => { const id=t.dataset.tab; t.classList.toggle('done', !!S.done[id] || (id==='final' && S.final && S.final.ok)); });
  refreshInicio();
}

document.addEventListener('click', e => {
  const s = e.target.closest('.say'); if(s){ e.preventDefault(); speak(s.dataset.say, s); return; }
  const tb = e.target.closest('.tab'); if(tb){ show(tb.dataset.tab); return; }
  const go = e.target.closest('[data-go]'); if(go){ e.preventDefault(); show(go.dataset.go); return; }
  const rv = e.target.closest('[data-rev]'); if(rv){ const r = rv.nextElementSibling; r.classList.toggle('on'); rv.textContent = r.classList.contains('on') ? 'Ocultar respuesta' : 'Ver respuesta'; return; }
  const md = e.target.closest('[data-markdone]'); if(md){ const t = TOPICS.find(x=>x.id===md.dataset.markdone); if(t) completeTopic(t); return; }
});
$('#speed').onclick = () => { S.rate = S.rate < 0.9 ? 1 : 0.75; $('#speed').textContent = 'Audio: ' + (S.rate < 0.9 ? 'lento' : 'normal'); try{ localStorage.setItem('holandes_audio', S.rate); }catch(e){} };
$('#lvsel').onchange = e => { location.href = 'holandes_' + e.target.value + '.html'; };
const lastSeen = S.last;
refresh(); pickVoice();
if(TOPICS.every(t => S.done[t.id]) && S.final && S.final.ok) $('#lvl-done').innerHTML = levelDoneHTML();
if(lastSeen && tabs.some(t=>t.id===lastSeen)){
  const lt = tabs.find(t=>t.id===lastSeen);
  $('#resume').innerHTML = `<div class="goal"><b>Continuar donde lo dejaste:</b> ${lt.label} <button class="btn small" data-go="${lastSeen}" style="margin-left:8px">Continuar &rarr;</button></div>`;
}
const start = (location.hash||'').slice(1);
show(tabs.some(t=>t.id===start) ? start : 'inicio');
})();
</script>
</body></html>
